[project]
name = "fluxwall"
version = "0.1.0"
description = "Parametric iOS Live Wallpaper Generator"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "numba>=0.59",
    "matplotlib>=3.8",
    "opencv-python>=4.9",
    "pillow>=10.3",
    "pillow-heif>=1.4",
    "ffmpeg-python>=0.2",
    "imageio>=2.35",
    "imageio-ffmpeg>=0.4",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.16",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
]
livephoto = [
    "makelive>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxwall"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.16",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ARG", "PTH", "T20", "SIM", "RET", "PERF", "LOG"]
ignore = ["S101", "ARG001", "ARG002"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ffmpeg", "pillow_heif"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
