# Frontend SPA server config
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;

    # Assets are content-hashed by Vite, cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: route unknown paths to index.html so the React
    # router can handle client-side routes like /studio.
    location / {
        try_files $uri $uri/ /index.html;
    }
}